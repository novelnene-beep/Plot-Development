<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StoryCraft Lite</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --input-bg: #2a2a32;
      --accent-color: #6366f1;
      --danger-color: #ef4444;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #0f172a;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .btn-export-header {
      background-color: #334155;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 15px;
      padding-bottom: 100px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .btn-add {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .input-group {
      margin-bottom: 10px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #0f172a;
      display: flex;
      border-top: 1px solid var(--border-color);
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      background: none;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--accent-color);
      font-weight: bold;
    }

    .empty-state {
      text-align: center;
      color: var(--text-sub);
      padding: 40px 20px;
      font-size: 0.9rem;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      border: 1px solid var(--border-color);
    }

    .modal-content h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .modal-content textarea {
      flex: 1;
      min-height: 180px;
      margin-bottom: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-copy { background-color: var(--accent-color); color: white; }
    .btn-download { background-color: #10b981; color: white; }
    .btn-close { background-color: #475569; color: white; }
  </style>
</head>
<body>

  <header>
    <h1>StoryCraft Lite</h1>
    <button class="btn-export-header" onclick="openExportModal()">📋 書き出し</button>
  </header>

  <main>
    <!-- キャラクタータブ -->
    <div id="tab-characters" class="tab-content active">
      <button class="btn-add" onclick="addCharacter()">＋ キャラクターを追加</button>
      <div id="character-list"></div>
    </div>

    <!-- 章プロットタブ -->
    <div id="tab-chapters" class="tab-content">
      <button class="btn-add" onclick="addChapter()">＋ 章を追加</button>
      <div id="chapter-list"></div>
    </div>

    <!-- エピソードタブ -->
    <div id="tab-episodes" class="tab-content">
      <button class="btn-add" onclick="addEpisode()">＋ エピソードを追加</button>
      <div id="episode-list"></div>
    </div>
  </main>

  <nav>
    <button class="nav-item active" onclick="switchTab('characters')">
      👤 キャラ
    </button>
    <button class="nav-item" onclick="switchTab('chapters')">
      📖 章プロット
    </button>
    <button class="nav-item" onclick="switchTab('episodes')">
      📌 エピソード
    </button>
  </nav>

  <!-- テキスト出力モーダル -->
  <div id="export-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>📋 プロットテキスト出力</h2>
      
      <div class="input-group">
        <label>ファイル名 (.txt)</label>
        <input type="text" id="export-filename" value="my_story_plot" placeholder="例: 作品タイトル_プロット">
      </div>

      <textarea id="export-text" readonly></textarea>
      
      <div class="modal-actions">
        <button class="modal-btn btn-copy" onclick="copyExportText()">全コピー</button>
        <button class="modal-btn btn-download" onclick="downloadExportText()">保存 (.txt)</button>
        <button class="modal-btn btn-close" onclick="closeExportModal()">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    let appData = {
      characters: [],
      chapters: [],
      episodes: []
    };

    function init() {
      const savedData = localStorage.getItem('storycraft_lite_data');
      if (savedData) {
        try {
          appData = JSON.parse(savedData);
          if (!appData.episodes) appData.episodes = [];
        } catch (e) {
          console.error('Failed to parse stored data');
        }
      } else {
        appData = {
          characters: [
            { id: Date.now(), name: "主人公 (アキラ)", role: "主人公", memo: "気弱だが正義感が強い。" }
          ],
          chapters: [
            { id: Date.now() + 1, title: "第1章 接触と予兆", plot: "平穏な日常に突如現れた謎の男。" }
          ],
          episodes: [
            { id: Date.now() + 2, title: "ヒロインとヒーローが出会う", chapter: "第1章", memo: "雨の日のバス停にて" }
          ]
        };
        saveData();
      }
      render();
    }

    function saveData() {
      localStorage.setItem('storycraft_lite_data', JSON.stringify(appData));
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // キャラ操作
    function addCharacter() {
      appData.characters.push({ id: Date.now(), name: "", role: "", memo: "" });
      saveData();
      renderCharacters();
    }
    function updateCharacter(id, field, value) {
      const char = appData.characters.find(c => c.id === id);
      if (char) { char[field] = value; saveData(); }
    }
    function deleteCharacter(id) {
      if (confirm('削除しますか？')) {
        appData.characters = appData.characters.filter(c => c.id !== id);
        saveData(); renderCharacters();
      }
    }

    // 章操作
    function addChapter() {
      appData.chapters.push({ id: Date.now(), title: `第${appData.chapters.length + 1}章 `, plot: "" });
      saveData();
      renderChapters();
    }
    function updateChapter(id, field, value) {
      const chap = appData.chapters.find(c => c.id === id);
      if (chap) { chap[field] = value; saveData(); }
    }
    function deleteChapter(id) {
      if (confirm('削除しますか？')) {
        appData.chapters = appData.chapters.filter(c => c.id !== id);
        saveData(); renderChapters();
      }
    }

    // エピソード操作
    function addEpisode() {
      appData.episodes.push({ id: Date.now(), title: "", chapter: "未定", memo: "" });
      saveData();
      renderEpisodes();
    }
    function updateEpisode(id, field, value) {
      const ep = appData.episodes.find(e => e.id === id);
      if (ep) { ep[field] = value; saveData(); }
    }
    function deleteEpisode(id) {
      if (confirm('削除しますか？')) {
        appData.episodes = appData.episodes.filter(e => e.id !== id);
        saveData(); renderEpisodes();
      }
    }

    // 描画
    function render() {
      renderCharacters();
      renderChapters();
      renderEpisodes();
    }

    function renderCharacters() {
      const listEl = document.getElementById('character-list');
      listEl.innerHTML = '';
      if (appData.characters.length === 0) {
        listEl.innerHTML = '<div class="empty-state">キャラがありません</div>';
        return;
      }
      appData.characters.forEach(char => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span style="font-size:0.85rem; color:var(--text-sub);">キャラカード</span>
            <button class="btn-delete" onclick="deleteCharacter(${char.id})">削除</button>
          </div>
          <div class="input-group"><label>名前</label><input type="text" value="${char.name || ''}" placeholder="例: アキラ" oninput="updateCharacter(${char.id}, 'name', this.value)"></div>
          <div class="input-group"><label>役職・立場</label><input type="text" value="${char.role || ''}" placeholder="例: 主人公" oninput="updateCharacter(${char.id}, 'role', this.value)"></div>
          <div class="input-group"><label>性格・メモ</label><textarea placeholder="メモを入力..." oninput="updateCharacter(${char.id}, 'memo', this.value)">${char.memo || ''}</textarea></div>
        `;
        listEl.appendChild(card);
      });
    }

    function renderChapters() {
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = '';
      if (appData.chapters.length === 0) {
        listEl.innerHTML = '<div class="empty-state">章がありません</div>';
        return;
      }
      appData.chapters.forEach(chap => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span style="font-size:0.85rem; color:var(--text-sub);">章カード</span>
            <button class="btn-delete" onclick="deleteChapter(${chap.id})">削除</button>
          </div>
          <div class="input-group"><label>章タイトル</label><input type="text" value="${chap.title || ''}" placeholder="例: 第1章 旅立ち" oninput="updateChapter(${chap.id}, 'title', this.value)"></div>
          <div class="input-group"><label>あらすじ</label><textarea placeholder="内容を入力..." oninput="updateChapter(${chap.id}, 'plot', this.value)">${chap.plot || ''}</textarea></div>
        `;
        listEl.appendChild(card);
      });
    }

    function renderEpisodes() {
      const listEl = document.getElementById('episode-list');
      listEl.innerHTML = '';
      if (appData.episodes.length === 0) {
        listEl.innerHTML = '<div class="empty-state">エピソードがありません</div>';
        return;
      }
      appData.episodes.forEach(ep => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span style="font-size:0.85rem; color:var(--text-sub);">エピソードカード</span>
            <button class="btn-delete" onclick="deleteEpisode(${ep.id})">削除</button>
          </div>
          <div class="input-group"><label>起こる出来事</label><input type="text" value="${ep.title || ''}" placeholder="例: ヒロインと出会う" oninput="updateEpisode(${ep.id}, 'title', this.value)"></div>
          <div class="input-group"><label>割り当てる章</label><input type="text" value="${ep.chapter || ''}" placeholder="例: 第1章 / 未定" oninput="updateEpisode(${ep.id}, 'chapter', this.value)"></div>
          <div class="input-group"><label>詳細・メモ</label><textarea placeholder="詳細を入力..." oninput="updateEpisode(${ep.id}, 'memo', this.value)">${ep.memo || ''}</textarea></div>
        `;
        listEl.appendChild(card);
      });
    }

    // テキスト書き出し処理
    function generateExportText() {
      let text = "========================================\n";
      text += " StoryCraft Lite - プロット設定資料\n";
      text += "========================================\n\n";

      text += "【 👤 キャラクター一覧 】\n";
      if (appData.characters.length === 0) {
        text += "（登録なし）\n";
      } else {
        appData.characters.forEach((c, index) => {
          text += `${index + 1}. ${c.name || '（名称未設定）'} [役職: ${c.role || 'なし'}]\n`;
          if (c.memo) text += `   メモ: ${c.memo.replace(/\n/g, '\n   ')}\n`;
          text += "\n";
        });
      }

      text += "----------------------------------------\n";
      text += "【 📖 章プロット一覧 】\n";
      if (appData.chapters.length === 0) {
        text += "（登録なし）\n";
      } else {
        appData.chapters.forEach((ch, index) => {
          text += `■ ${ch.title || '（タイトル未設定）'}\n`;
          if (ch.plot) text += `   あらすじ:\n   ${ch.plot.replace(/\n/g, '\n   ')}\n`;
          text += "\n";
        });
      }

      text += "----------------------------------------\n";
      text += "【 📌 エピソード一覧 】\n";
      if (appData.episodes.length === 0) {
        text += "（登録なし）\n";
      } else {
        appData.episodes.forEach((ep, index) => {
          text += `・${ep.title || '（出来事未設定）'} [配置: ${ep.chapter || '未定'}]\n`;
          if (ep.memo) text += `   詳細: ${ep.memo.replace(/\n/g, '\n   ')}\n`;
          text += "\n";
        });
      }

      return text;
    }

    function openExportModal() {
      const exportArea = document.getElementById('export-text');
      exportArea.value = generateExportText();
      document.getElementById('export-modal').classList.add('active');
    }

    function closeExportModal() {
      document.getElementById('export-modal').classList.remove('active');
    }

    function copyExportText() {
      const exportArea = document.getElementById('export-text');
      exportArea.select();
      navigator.clipboard.writeText(exportArea.value).then(() => {
        alert('クリップボードにコピーしました！');
      }).catch(() => {
        alert('コピーに失敗しました。手動で選択してコピーしてください。');
      });
    }

    function downloadExportText() {
      const text = generateExportText();
      const rawFileName = document.getElementById('export-filename').value.trim();
      const fileName = rawFileName ? `${rawFileName}.txt` : 'story_plot.txt';
      
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    init();
  </script>
</body>
</html>
