<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryCraft Lite</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --input-bg: #2a2a32;
      --accent-color: #6366f1;
      --danger-color: #ef4444;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #0f172a;
      padding: 15px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 1.2rem;
      color: var(--text-main);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      padding-bottom: 80px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .btn-add {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .input-group {
      margin-bottom: 10px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #0f172a;
      display: flex;
      border-top: 1px solid var(--border-color);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--accent-color);
      font-weight: bold;
    }

    .empty-state {
      text-align: center;
      color: var(--text-sub);
      padding: 40px 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>StoryCraft Lite</h1>
  </header>

  <main>
    <!-- キャラクタータブ -->
    <div id="tab-characters" class="tab-content active">
      <button class="btn-add" onclick="addCharacter()">＋ キャラクターを追加</button>
      <div id="character-list"></div>
    </div>

    <!-- 章プロットタブ -->
    <div id="tab-chapters" class="tab-content">
      <button class="btn-add" onclick="addChapter()">＋ 章を追加</button>
      <div id="chapter-list"></div>
    </div>
  </main>

  <nav>
    <button class="nav-item active" onclick="switchTab('characters')">
      👤 キャラクター
    </button>
    <button class="nav-item" onclick="switchTab('chapters')">
      📖 章プロット
    </button>
  </nav>

  <script>
    // データモデル
    let appData = {
      characters: [],
      chapters: []
    };

    // 初期化（LocalStorageからの読み込み）
    function init() {
      const savedData = localStorage.getItem('storycraft_lite_data');
      if (savedData) {
        try {
          appData = JSON.parse(savedData);
        } catch (e) {
          console.error('Failed to parse stored data');
        }
      } else {
        // 初期サンプルデータ
        appData = {
          characters: [
            { id: Date.now(), name: "主人公 (アキラ)", role: "主人公", memo: "気弱だが正義感が強い。物語を通して勇敢へと成長する。" }
          ],
          chapters: [
            { id: Date.now() + 1, title: "第1章 接触と予兆", plot: "平穏な日常に突如現れた謎の男。主人公は巻き込まれていく。" }
          ]
        };
        saveData();
      }
      render();
    }

    // 保存処理
    function saveData() {
      localStorage.setItem('storycraft_lite_data', JSON.stringify(appData));
    }

    // タブ切り替え
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // キャラクター操作
    function addCharacter() {
      const newChar = {
        id: Date.now(),
        name: "",
        role: "",
        memo: ""
      };
      appData.characters.push(newChar);
      saveData();
      renderCharacters();
    }

    function updateCharacter(id, field, value) {
      const char = appData.characters.find(c => c.id === id);
      if (char) {
        char[field] = value;
        saveData();
      }
    }

    function deleteCharacter(id) {
      if (confirm('このキャラクターを削除しますか？')) {
        appData.characters = appData.characters.filter(c => c.id !== id);
        saveData();
        renderCharacters();
      }
    }

    // 章プロット操作
    function addChapter() {
      const newChap = {
        id: Date.now(),
        title: `第${appData.chapters.length + 1}章 `,
        plot: ""
      };
      appData.chapters.push(newChap);
      saveData();
      renderChapters();
    }

    function updateChapter(id, field, value) {
      const chap = appData.chapters.find(c => c.id === id);
      if (chap) {
        chap[field] = value;
        saveData();
      }
    }

    function deleteChapter(id) {
      if (confirm('この章を削除しますか？')) {
        appData.chapters = appData.chapters.filter(c => c.id !== id);
        saveData();
        renderChapters();
      }
    }

    // 画面描写
    function render() {
      renderCharacters();
      renderChapters();
    }

    function renderCharacters() {
      const listEl = document.getElementById('character-list');
      listEl.innerHTML = '';

      if (appData.characters.length === 0) {
        listEl.innerHTML = '<div class="empty-state">キャラクターが登録されていません。<br>「＋ キャラクターを追加」を押して追加してください。</div>';
        return;
      }

      appData.characters.forEach(char => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span style="font-size:0.85rem; color:var(--text-sub);">キャラカード</span>
            <button class="btn-delete" onclick="deleteCharacter(${char.id})">削除</button>
          </div>
          <div class="input-group">
            <label>名前</label>
            <input type="text" value="${char.name || ''}" placeholder="例: アキラ" oninput="updateCharacter(${char.id}, 'name', this.value)">
          </div>
          <div class="input-group">
            <label>役職・立場</label>
            <input type="text" value="${char.role || ''}" placeholder="例: 主人公 / 相棒 / 宿敵" oninput="updateCharacter(${char.id}, 'role', this.value)">
          </div>
          <div class="input-group">
            <label>性格・メモ・変化</label>
            <textarea placeholder="例: 最初は弱気だが、仲間を守るために立ち上がる" oninput="updateCharacter(${char.id}, 'memo', this.value)">${char.memo || ''}</textarea>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function renderChapters() {
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = '';

      if (appData.chapters.length === 0) {
        listEl.innerHTML = '<div class="empty-state">章プロットが登録されていません。<br>「＋ 章を追加」を押して追加してください。</div>';
        return;
      }

      appData.chapters.forEach(chap => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span style="font-size:0.85rem; color:var(--text-sub);">章カード</span>
            <button class="btn-delete" onclick="deleteChapter(${chap.id})">削除</button>
          </div>
          <div class="input-group">
            <label>章タイトル</label>
            <input type="text" value="${chap.title || ''}" placeholder="例: 第1章 旅立ち" oninput="updateChapter(${chap.id}, 'title', this.value)">
          </div>
          <div class="input-group">
            <label>起こる出来事・あらすじ</label>
            <textarea placeholder="この章で何が起きるかを入力..." oninput="updateChapter(${chap.id}, 'plot', this.value)">${chap.plot || ''}</textarea>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // 起動
    init();
  </script>
</body>
</html>
